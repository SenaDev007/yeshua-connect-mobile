name: yeshua_connect
description: "Mouvement Christ Libère — Application mobile officielle (accueil du ministère, messagerie communautaire Yeshua Connect, hors-ligne complet)"
publish_to: 'none'
version: 2.10.0+23

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Gestion d'état — versions STRICTES (alignées Academia-Helm-mobile)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # HTTP + cookies de session NextAuth
  dio: ^5.4.3+1
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Persistance légère (session, préférences)
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # ⭐ V2.0 — BASE DE DONNÉES LOCALE SQLite : miroir hors-ligne de TOUT le
  # contenu public du site (serviteurs, témoignages, enseignements, vidéos,
  # annonces…) + file d'envoi des messages rédigés hors ligne (outbox
  # « façon WhatsApp » — envoi automatique au retour du réseau).
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # UI
  cached_network_image: ^3.3.1
  # Plage compatible Flutter 3.24.x (intl 0.19.0 imposé par
  # flutter_localizations) ET Flutter 3.27+ (intl 0.20.2 imposé).
  # Usage limité à DateFormat('…', 'fr_FR') — API stable sur 0.19/0.20.
  intl: '>=0.19.0 <0.21.0'

  # Utilitaires
  connectivity_plus: ^6.0.3
  livekit_client: 2.3.4
  agora_rtc_engine: 6.5.0
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  # ⭐ V2.5 — Compression photo de profil (JPEG natif) : même mécanique que
  # le web (canvas 256 JPEG ≤ 60 Ko) → PUT /api/user/profile accepte les
  # data-URL ≤ 100 Ko.
  flutter_image_compress: ^2.3.0
  # ⭐ V1.5.1 — record 7.x : génération 2.x cohérente des sous-paquets
  # (record_linux 0.7.2 + record_platform_interface 1.6.0 = combo de
  # l'ancienne génération Cassé : RecordLinux n'implémente pas
  # startStream de l'interface 1.6.0 → erreur de compilation Dart sur
  # TOUS les builds, y compris Android).
  record: ^7.1.1
  audioplayers: ^6.1.0
  flutter_sound: ^9.28.0
  url_launcher: ^6.3.0

  # ⭐ V2.9 — PARTAGE VIDÉO (feuille de partage native Android/iOS) : même
  # pattern que le ShareModal du web — titre + lien public de la vidéo.
  share_plus: ^10.1.2

  # ⭐ V1.5 — Écran viewer du LIVE public : lecture du flux HLS (mode
  # YouTube V3.22 — ExoPlayer/AVPlayer natifs, 0 participant LiveKit).
  video_player: 2.9.1

  # ⭐ V2.2 — LECTEUR VIDÉO INTÉGRÉ YouTube / TikTok : les vidéos jouent
  # DANS l'app (iframe officielle en WebView) — plus aucune sortie vers
  # les applications externes (exigence pasteur).
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0

  # ⭐ V2.4 — LECTEUR YOUTUBE OFFICIEL : l'embed brut youtube.com/embed
  # échouait en WebView (« erreur de configuration du lecteur 153 ») ; le
  # paquet youtube_player_iframe (IFrame API dans une page HTML maîtrisée)
  # est la solution éprouvée de l'écosystème Flutter.
  # ⭐ V2.7 — FORK LOCAL 5.2.1+cl.1 : le host de l'iframe est découplé de
  # l'origine (youtube.com FIXE, comme le site public) — certaines vidéos
  # refusaient l'embed youtube-nocookie.com alors qu'elles jouent sur le
  # site. Détails : packages/youtube_player_iframe/PATCH-CHRIST-LIBERE.md
  youtube_player_iframe:
    path: packages/youtube_player_iframe

  # ⭐ V1.4 — Notifications push (FCM) : initialisation 100 % runtime via
  # --dart-define (aucun google-services.json requis) ; si les identifiants
  # ne sont pas fournis, le push se désactive proprement.
  firebase_core: 3.9.0
  firebase_messaging: 15.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # ⭐ V1.7 — Identité visuelle officielle (mêmes fichiers que le web) :
  # logo Christ Libère + son du shofar (intro web /sounds/shofar.mp3)
  # + sonnerie d'appel sortant (/sounds/ringback.wav).
  assets:
    - assets/images/logo-christ-libere.png
    - assets/images/carte-monde-disperses.png
    - assets/sounds/shofar.mp3
    - assets/sounds/ringback.wav
