name: yeshua_connect
description: "Yeshua Connect — Application mobile officielle du Mouvement Christ Libère (messagerie, privés confidentiels, appels audio/vidéo)"
publish_to: 'none'
version: 1.5.0+6

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Gestion d'état — versions STRICTES (alignées Academia-Helm-mobile)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # HTTP + cookies de session NextAuth
  dio: ^5.4.3+1
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Persistance légère (session, préférences)
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # UI
  cached_network_image: ^3.3.1
  # Plage compatible Flutter 3.24.x (intl 0.19.0 imposé par
  # flutter_localizations) ET Flutter 3.27+ (intl 0.20.2 imposé).
  # Usage limité à DateFormat('…', 'fr_FR') — API stable sur 0.19/0.20.
  intl: '>=0.19.0 <0.21.0'

  # Utilitaires
  connectivity_plus: ^6.0.3
  livekit_client: 2.3.4
  agora_rtc_engine: 6.5.0
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  # ⭐ V1.5.1 — record 7.x : génération 2.x cohérente des sous-paquets
  # (record_linux 0.7.2 + record_platform_interface 1.6.0 = combo de
  # l'ancienne génération Cassé : RecordLinux n'implémente pas
  # startStream de l'interface 1.6.0 → erreur de compilation Dart sur
  # TOUS les builds, y compris Android).
  record: ^7.1.1
  audioplayers: ^6.1.0
  flutter_sound: ^9.28.0
  url_launcher: ^6.3.0

  # ⭐ V1.5 — Écran viewer du LIVE public : lecture du flux HLS (mode
  # YouTube V3.22 — ExoPlayer/AVPlayer natifs, 0 participant LiveKit).
  video_player: 2.9.1

  # ⭐ V1.4 — Notifications push (FCM) : initialisation 100 % runtime via
  # --dart-define (aucun google-services.json requis) ; si les identifiants
  # ne sont pas fournis, le push se désactive proprement.
  firebase_core: 3.9.0
  firebase_messaging: 15.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
