plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// ⭐ V2.9 — SIGNATURE RELEASE (Play Store) : lit android/key.properties
// (jamais versionné — voir android/.gitignore). La clé de téléversement
// est christ-libere-upload.keystore, à placer dans android/app/.
// SANS ces fichiers (machine sans clé) : repli debug — le build local
// continue de fonctionner, et Play Store refuse un bundle debug-signé.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '2'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.1.0'

android {
    namespace "mouvement.christlibere.yeshuaconnect"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    defaultConfig {
        applicationId "mouvement.christlibere.yeshuaconnect"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // ⭐ V1.9 — APK ALLÉGÉ : ne conserver que les ressources FR
        // (l'app est intégralement française — écarte les tables de
        // ressources des ~80 autres locales des dépendances).
        resourceConfigurations += ["fr"]
    }

    // ⭐ V2.9 — Signature release depuis key.properties (Play Store).
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // ⭐ V2.9 — clé release si présente, sinon repli debug
            // (le bundle produit est alors refusé par Play, jamais
            // publié par erreur).
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }

            // ⭐ V1.9 — APK ALLÉGÉ : R8 minification + réduction des
            // ressources. Les règles de conservation des SDK natifs
            // (LiveKit/WebRTC, Agora, Firebase) sont dans
            // proguard-rules.pro.
            //
            // IMPORTANT : associer `flutter build apk --release
            // --split-per-abi` pour ne PAS embarquer les 4 architectures
            // dans un même APK (cause n°1 des 326 Mo constatés : APK debug
            // UNIVERSEL = armv7 + arm64 + x86 + x86_64 + symboles).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    // ⭐ V2.9.4 — ANTI-BLOCAGE : ne pas laisser lintVital faire échouer
    // l'AAB release (contrôles lint de gravité « fatal » déclenchés par
    // le code natif des plugins tiers — Agora, LiveKit/WebRTC…).
    // Le Play Store refait de toute façon ses propres contrôles à l'upload.
    lint {
        checkReleaseBuilds false
    }
}

flutter {
    source '../..'
}
